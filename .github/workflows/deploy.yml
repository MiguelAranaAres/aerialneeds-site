name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"   # refresh prices & stock from Shopify every 4 hours
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site from Shopify
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # While previewing on github.io set PREVIEW=1 and BASE_PATH=/aerialneeds-site.
          # After the domain switch delete both and set FALLBACK_ORIGIN=https://shop.aerialneeds.com
          PREVIEW: ${{ vars.PREVIEW }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          FALLBACK_ORIGIN: ${{ vars.FALLBACK_ORIGIN }}
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
